{% extends "base_accounts.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="login panel">
<span class="eyebrow">ACCOUNT RECOVERY</span><h1>Set a new password</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if token %}
<form class="form" method="post">
<input name="password" type="password" placeholder="New password (8+ characters)" minlength="8" autocomplete="new-password" required>
<input name="confirm_password" type="password" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required>
<button type="submit">Change password</button>
</form>
{% endif %}
</div>
{% endblock %}
