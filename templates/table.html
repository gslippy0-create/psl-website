{% extends "base.html" %}{% block title %}League Table{% endblock %}{% block content %}
<section class="page-head"><span class="eyebrow">PSL</span><h1>League Table</h1></section><section class="panel"><table class="big"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr>{% for r in table %}<tr><td>{{loop.index}}</td><td><b>{{r.team}}</b></td><td>{{r.played}}</td><td>{{r.wins}}</td><td>{{r.draws}}</td><td>{{r.losses}}</td><td>{{r.gf}}</td><td>{{r.ga}}</td><td>{{"%+d"|format(r.gd)}}</td><td><b>{{r.points}}</b></td></tr>{% endfor %}</table></section>{% endblock %}
