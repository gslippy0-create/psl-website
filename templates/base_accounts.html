<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PSL{% endblock %} | Pro Super League</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
<header class="nav">
<a class="brand" href="/"><img src="/static/psl-logo.png"><span>PSL</span></a>
<nav>
<a href="/">Home</a><a href="/table">League</a><a href="/fixtures">Fixtures</a><a href="/teams">Teams</a><a href="/players">Players</a><a href="/transfers">Transfers</a><a href="/totw">TOTW</a>
{% if logged_in %}
<a class="gold" href="/admin">Admin</a><a href="/logout">Logout</a>
{% elif user_logged_in %}
<a class="gold" href="/account">My Profile</a><a href="/dashboard">Dashboard</a><a href="/logout">Logout</a>
{% elif discord_logged_in %}
<a class="gold" href="/dashboard">Dashboard</a><a href="/logout">Logout</a>
{% else %}
<a class="gold" href="/login">Login</a><a href="/register">Register</a>
{% endif %}
</nav></header>
<main>{% block content %}{% endblock %}</main>
<footer>PSL • FC27 Pro Clubs League</footer>
</body></html>
