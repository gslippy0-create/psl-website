{% extends "base.html" %}{% block title %}Team of the Week{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">PSL HONOURS</span><h1>Team of the Week</h1></section><div class="cards">{% for p in rows %}<article class="card"><span class="eyebrow">{{p.week}}</span><div class="crest">{{p.position[:3].upper()}}</div><h2>{{p.player}}</h2><p>{{p.position}} • {{p.team}}</p></article>{% else %}<p class="muted">No TOTW selections yet.</p>{% endfor %}</div>{% endblock %}
